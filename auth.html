<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VitalTrack — Login</title>
<link rel="stylesheet" href="css/style.css">
<!-- Load Auth Logic as a Module -->
<script type="module" src="js/auth.js" defer></script>
</head>
<body>
<div class="auth-wrapper" style="opacity: 1; pointer-events: auto;">
  <div class="auth-box">
    <div class="brand" style="justify-content: center; margin-bottom: 20px;">
      <div class="logo">V</div><span>VitalTrack</span>
    </div>
    <h2 id="auth-title" style="text-align: center; margin: 0 0 10px 0;">Welcome Back</h2>
    <p class="subtitle" id="auth-subtitle" style="text-align: center; margin-bottom: 24px;">Log in to continue your 90-day journey.</p>
    
    <div class="formgrid" style="grid-template-columns: 1fr; gap: 16px;">
      <div class="field">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" required>
      </div>
    </div>
    
    <button class="btn primary" id="auth-submit" style="width: 100%; margin-top: 24px; padding: 14px; font-size: 16px;">Log In</button>
    <div id="auth-error" style="color: var(--danger); font-size: 13px; text-align: center; margin-top: 15px; min-height: 15px;"></div>
    
    <p style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted);">
      <span id="auth-switch-text">Don't have an account?</span> 
      <button id="auth-switch-btn" style="background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; font-size: 13px; padding: 0;">Sign Up</button>
    </p>
  </div>
</div>
</body>
</html>
